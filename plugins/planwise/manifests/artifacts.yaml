# Plugin Artifact Manifest
#
# Enumerates every on-disk artifact the init script produces, the config key
# (or block) it depends on, the producer step, the downstream consumer skill,
# and the action to take when the config dependency is missing.
#
# Consumed by scripts/init_project.py to:
#   1. Validate config.yaml against the artifact graph
#   2. Decide between template-default rendering, loud warning, or migration
#   3. Drive the Step 10 banner so SKIPPED rows surface with full context
#
# When a new handler or skill introduces a config-driven artifact, add a row
# here so the gap-detection logic remains mechanical instead of implicit.

schema_version: 2

# How init_project.py reacts when an artifact's required config key is missing.
#
#   render_from_template_default: fall back to the value baked into
#     config.yaml.template (or an equivalent in-script constant) and proceed.
#     Print an INFO line in the Step 10 banner.
#
#   warn_loud: skip the artifact but emit a Step 10 WARNING that names the
#     missing key, the affected consumer skill, and the remediation command.
#
#   fail_loud: stop init with a non-zero exit. Reserved for blocks whose
#     absence makes downstream skills unrecoverable.
#
#   migrate_only: artifact is generated by a separate flow; init does not
#     produce it, but `--migrate` MUST add the missing key so the consumer
#     skill can run on next invocation.

missing_key_behaviors:
  - render_from_template_default
  - warn_loud
  - fail_loud
  - migrate_only

# upgrade_behavior dictates how `/planwise upgrade` treats each artifact when
# the user's pinned plugin_version is older than the currently-installed
# plugin version.
#
#   refresh_or_sidecar: For installed copies. Compare the normalized installed
#     body to the shipped body. Match -> overwrite preserving per-project
#     frontmatter (rules: keep the user's paths: line). Diverged -> write
#     a `.new` sidecar under {planwise_root}/upgrade-conflicts/<from>-to-<to>/
#     and emit a SKIPPED row in the upgrade banner.
#
#   preserve: Never modify after install. User-owned data (config.yaml,
#     rendered categorization file, seed index files). Banner emits an INFO
#     row only if the file is missing (re-run init to recreate).
#
#   migrate_only: Handled by migrate_config(), not by the artifact-refresh
#     loop. Applies to top-level config keys. migrate_config() is purely
#     additive — it adds the key when absent and NEVER overwrites a value
#     that is already present — so a key whose value must track the
#     installed plugin cannot use this behavior (see commit_point_write).
#
#   commit_point_write: Rewritten by the upgrade commit point itself, not by
#     migrate_config() and not by the artifact-refresh loop. Applies to the
#     top-level config keys that MUST track the currently-installed plugin:
#     an additive merge cannot refresh an already-present value, so leaving
#     such a key to migrate_only would strand it pointing at the superseded
#     install. All keys carrying this behavior are written together in one
#     parse-checked write, so they can never land half-committed.
#
#   not_installed: Documents an artifact that is read in-place from the
#     plugin directory (never copied to the project). The upgrade loop
#     ignores it; the row exists for contributor visibility so future work
#     doesn't invent a duplicate install path.

upgrade_behaviors:
  - refresh_or_sidecar
  - preserve
  - migrate_only
  - commit_point_write
  - not_installed

artifacts:
  - id: config_yaml
    on_disk: "{planwise_root}/config.yaml"
    config_keys: []                       # the config itself
    producer: "generate_config()"
    consumers:
      - "all handlers (config gate)"
    missing_key_behavior: warn_loud
    upgrade_behavior: preserve
    notes: >
      If config.yaml is absent, every handler's config gate triggers
      Auto-Init Fallback. The init script generates it from
      config.yaml.template.

  - id: categorization_file
    on_disk: "{planwise_root}/{lessons_dir}/00-Categorization-By-Domain.md"
    config_keys:
      - "categorization"
      - "categorization.buckets"
      - "categorization.decision_tree_order"
    producer: "render_categorization_file() / init.md Step 5.1 fallback"
    consumers:
      - "/planwise lessons curate"
      - "/planwise lessons promote-batch"
    missing_key_behavior: render_from_template_default
    upgrade_behavior: preserve
    template_default: "DEFAULT_CATEGORIZATION (init_project.py)"
    notes: >
      When the user's config omits the categorization block, fall back to the
      4-bucket default (database / code / process / tooling) baked into the
      script and emit an INFO banner row instructing the user to add the
      block to customise.

  - id: context_block
    on_disk: "{planwise_root}/config.yaml (key: context)"
    config_keys:
      - "context.plan_tier"
      - "context.context_window"
    producer: "generate_config() / --migrate"
    consumers:
      - "/planwise plan (token-budget scaling)"
      - "/planwise review (Meta-Plan thresholds)"
      - "/planwise run (DELEGATED checks)"
    missing_key_behavior: migrate_only
    upgrade_behavior: migrate_only
    notes: >
      Handlers default to plan_tier=pro / context_window=200000 when the
      block is absent, so init does not block on this — but `--migrate`
      MUST add the block to existing configs so the values are explicit.

  - id: plugin_root_key
    on_disk: "{planwise_root}/config.yaml (key: plugin_root)"
    config_keys:
      - "plugin_root"
    producer: "generate_config() / --migrate / --upgrade commit point"
    consumers:
      - "all handlers (script invocation paths)"
    missing_key_behavior: migrate_only
    upgrade_behavior: commit_point_write
    notes: >
      `plugin_root:` lets handlers locate plugin scripts without depending on
      CLAUDE_PLUGIN_ROOT. When missing in an existing config, `--migrate`
      adds it pointing at the currently-installed plugin path. On every
      `--upgrade` that bumps `plugin_version:`, the commit point repoints
      this key to the newly-installed plugin path in the SAME write, so the
      pair can never disagree (see `_commit_upgrade_pin()` in
      `scripts/init_project.py`); an already-current version pin whose
      `plugin_root` has drifted is repointed on its own on the next
      `--upgrade` run even though nothing else changes.

  - id: backlog_index
    on_disk: "{planwise_root}/{backlog_dir}/00-Index-Backlog.md"
    config_keys:
      - "project.backlog_dir"
      - "project.index_files.backlog"
    producer: "copy_seed_files()"
    consumers:
      - "/planwise backlog"
      - "/planwise list"
    missing_key_behavior: warn_loud
    upgrade_behavior: preserve

  - id: plans_index
    on_disk: "{planwise_root}/{plans_dir}/00-Index-Plans.md"
    config_keys:
      - "project.plans_dir"
      - "project.index_files.plans"
    producer: "copy_seed_files()"
    consumers:
      - "/planwise plan"
      - "/planwise list"
    missing_key_behavior: warn_loud
    upgrade_behavior: preserve

  - id: lessons_index
    on_disk: "{planwise_root}/{lessons_dir}/00-Index-LessonsLearned.md"
    config_keys:
      - "project.lessons_dir"
      - "project.index_files.lessons"
    producer: "copy_seed_files()"
    consumers:
      - "/planwise lessons"
    missing_key_behavior: warn_loud
    upgrade_behavior: preserve

  - id: planwise_rules
    on_disk: ".claude/rules/planwise/*.md"
    config_keys:
      - "project.planwise_root"
      - "project.plans_dir"
      - "project.backlog_dir"
      - "project.lessons_dir"
    producer: "install_rules()"
    consumers:
      - "all handlers (path-scoped rule injection)"
    missing_key_behavior: warn_loud
    upgrade_behavior: refresh_or_sidecar
    notes: >
      install_rules() installs ONLY the four `.claude/**`-scoped author-time
      rules (agent-authoring, skill-authoring, rule-authoring,
      artifact-self-containment) — see INSTALLED_RULES in init_project.py. The
      plan/backlog/lessons reference files that previously installed here are
      now handler-loaded in-place from references/ (upgrade_behavior:
      not_installed; see DESCOPED_RULES and the de-scoped rows below). On
      upgrade across RESCOPE_MIGRATION_VERSION, migrate_installed_rules()
      removes the untouched installed copies of those de-scoped rules AND
      high-confidence stale-subset copies (backed up under upgrade-backups/
      first); copies carrying user content (HAS_UNIQUE, or any flagged
      installed-only content) are preserved byte-for-byte, and paths-only
      edits are preserved while upgrade.descope_preserve_paths_edits is true
      (the default). This glob row covers only the four still-installed rules
      for refresh_or_sidecar.

  - id: agent_teams_env
    on_disk: "{settings_file}: env.CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS"
    config_keys:
      - "project.install_scope"
    producer: "configure_settings()"
    consumers:
      - "/planwise review (multi-reviewer teams)"
    missing_key_behavior: warn_loud
    upgrade_behavior: preserve

  - id: plugin_permissions
    on_disk: "{settings_file}: permissions.additionalDirectories"
    config_keys:
      - "project.install_scope"
    producer: "configure_settings()"
    consumers:
      - "all handlers (reading plugin files without prompts)"
    missing_key_behavior: warn_loud
    upgrade_behavior: preserve

  - id: plugin_version_key
    on_disk: "{planwise_root}/config.yaml (key: plugin_version)"
    config_keys:
      - "plugin_version"
    producer: "generate_config() / --migrate / --upgrade commit point"
    consumers:
      - "/planwise init (Step 10 stale-version detection)"
      - "/planwise upgrade (drift detection)"
    missing_key_behavior: migrate_only
    upgrade_behavior: commit_point_write
    notes: >
      Pinned plugin version, set on fresh init from .claude-plugin/plugin.json
      and added to existing configs by `--migrate`. When missing or older
      than the currently-installed plugin, `/planwise init` Step 10 emits a
      drift-detection SKIPPED row directing the user at `/planwise upgrade`.
      On every `--upgrade` the commit point rewrites this key in the SAME
      single write that repoints `plugin_root:` — the two are pinned as a
      pair so a reader can never see a new version against a superseded
      install path (see `_commit_upgrade_pin()` in `scripts/init_project.py`).

  - id: planwise_skill
    on_disk: "plugin in-place (skills/planwise/SKILL.md)"
    config_keys: []
    producer: "(not produced — read in-place from the plugin)"
    consumers:
      - "/planwise (router)"
    missing_key_behavior: warn_loud
    upgrade_behavior: not_installed
    notes: >
      Documents that the planwise router skill is read in-place from the
      plugin directory and is never copied to the project. The upgrade
      loop ignores it; this row exists so contributors don't invent a
      duplicate install path.

  - id: artifact_self_containment_rule
    on_disk: ".claude/rules/planwise/artifact-self-containment.md"
    config_keys: []
    producer: "install_rules()"
    consumers:
      - "/planwise lessons promote (Stage 4 self-containment grep)"
      - "/planwise lessons promote-batch"
      - "/planwise backlog"
    missing_key_behavior: warn_loud
    upgrade_behavior: refresh_or_sidecar
    notes: >
      Binding rule — promoted content-bearing artifacts (rules, agents, skills,
      handlers, CLAUDE.md callouts) MUST inline source-lesson/BB content, never
      cite it. Installed as a path-scoped rule covering the content-bearing
      artifact zones (.claude/rules|agents|skills|commands/**, CLAUDE.md) so the
      discipline injects when those artifacts are authored, and also read
      in-place by the promote/backlog self-containment grep gate. Covered by the
      planwise_rules glob row for refresh; listed individually because it has
      cross-handler consumers worth documenting. The canonical source is the
      in-place references/ copy: the promote/backlog grep gate reads
      references/artifact-self-containment.md in place, never this installed
      copy, which is injection-only. The planwise_rules glob row owns the
      refresh for this file (one INSTALLED_RULES entry); this row is
      documentation-only and does not cause a second install/refresh pass.

  - id: lessons_curate_workflow_reference
    on_disk: "plugin in-place (references/lessons-curate-workflow.md)"
    config_keys: []
    producer: "(not produced — read in-place from the plugin)"
    consumers:
      - "/planwise lessons curate"
    missing_key_behavior: warn_loud
    upgrade_behavior: not_installed
    notes: >
      Binding step-by-step protocol for curate mode (bucket selection,
      reporting format, anomaly detection). Read in-place when curate mode runs;
      never copied to the project and not path-scoped. Row exists for
      contributor visibility.

  - id: lessons_promote_batch_workflow_part1_reference
    on_disk: "plugin in-place (references/lessons-promote-batch-workflow-Part-1-ResolveAndGroup.md)"
    config_keys: []
    producer: "(not produced — read in-place from the plugin)"
    consumers:
      - "/planwise lessons promote-batch"
    missing_key_behavior: warn_loud
    upgrade_behavior: not_installed
    notes: >
      Phases 1-2 (resolve scope, group lessons) of the batch-promote workflow.
      Read in-place when promote-batch mode runs; never copied to the project
      and not path-scoped. Row exists for contributor visibility.

  - id: lessons_promote_batch_workflow_part2_reference
    on_disk: "plugin in-place (references/lessons-promote-batch-workflow-Part-2-DraftAndWrite.md)"
    config_keys: []
    producer: "(not produced — read in-place from the plugin)"
    consumers:
      - "/planwise lessons promote-batch"
    missing_key_behavior: warn_loud
    upgrade_behavior: not_installed
    notes: >
      Phases 3-4 (draft BBs, write files), BB structure spec, self-containment
      grep, and constraints of the batch-promote workflow. Read in-place when
      promote-batch mode runs; never copied to the project and not path-scoped.
      Row exists for contributor visibility.

  - id: verification_task_authoring_rule
    on_disk: "plugin in-place (references/verification-task-authoring.md)"
    config_keys: []
    producer: "(not produced — read in-place from the plugin)"
    consumers:
      - "/planwise review (plan-reviewer)"
    missing_key_behavior: warn_loud
    upgrade_behavior: not_installed
    notes: >
      Match-pattern authoring discipline for verification tasks (per-unit
      existence assertions over aggregate counts, denominator scoping, PASS/FAIL
      contract, orchestrator adjudication of BLOCKER-from-heuristic). De-scoped
      from the install set — no longer installed as a path-scoped rule under
      {planwise_root}/{plans_dir}/**; the plan-reviewer agent loads it in-place
      from references/ at review time (see DESCOPED_RULES in init_project.py).
      On upgrade across RESCOPE_MIGRATION_VERSION, migrate_installed_rules()
      removes the untouched or high-confidence stale-subset previously-
      installed copy (backed up under upgrade-backups/ first) and preserves
      any copy carrying user content. Listed individually because it has a
      named consumer worth documenting.

  - id: upgrade_block
    on_disk: "{planwise_root}/config.yaml (key: upgrade)"
    config_keys:
      - "upgrade"
    producer: "generate_config() / --migrate"
    consumers:
      - "/planwise upgrade (customization handoff, gh issue, de-scope policy)"
    missing_key_behavior: migrate_only
    upgrade_behavior: migrate_only
    notes: >
      Three keys (customization_handoff, github_issue,
      descope_preserve_paths_edits) controlling HAS_UNIQUE handoff routing and
      the de-scope paths-only-edit policy. When the block is absent,
      config_loader.get_upgrade_config() supplies the conservative defaults:
      report / false / TRUE (descope_preserve_paths_edits defaults to
      preserve — false opts in to removing paths-edited copies). The shipped
      config.yaml.template pins customization_handoff to report+relocate
      explicitly (automated transfer-then-adopt via the upgrade-transfers/
      preservation dir), while the absent-key fallback stays the conservative
      report (preserve + sidecar, no transfer); `--migrate` adds the block to
      existing configs.

  - id: customization_report
    on_disk: "{planwise_root}/upgrade-conflicts/{from}-to-{to}/ (INDEX.md + .new sidecars + verdicts.json)"
    config_keys: []
    producer: "upgrade_artifacts() / handlers/upgrade.md fan-out"
    consumers:
      - "/planwise upgrade (HAS_UNIQUE handoff)"
    missing_key_behavior: warn_loud
    upgrade_behavior: not_installed
    notes: >
      Generated handoff surface for preserved HAS_UNIQUE customizations. Reuses
      the existing upgrade-conflicts INDEX.md + sidecars rather than a new
      standalone report file. verdicts.json is consumed by a successful
      --upgrade run (renamed to verdicts.json.consumed so a stale verdict can
      never fire on a later pair/rerun); automated transfers land beside it
      under {planwise_root}/upgrade-transfers/{from}-to-{to}/ as dormant
      preservation documents. Never installed; row exists so the relocate/gh
      opt-in escalations don't invent a duplicate artifact path.


# Skills register their config dependencies here so the gap-detection rule
# stays mechanical. To extend:
#   1. Add a row above with id, on_disk, config_keys, producer, consumers,
#      missing_key_behavior.
#   2. If behaviour is render_from_template_default, declare the in-script
#      constant under template_default and implement the fallback in
#      init_project.py.
#   3. If behaviour is migrate_only, add the top-level key to
#      config.yaml.template so `--migrate` picks it up automatically.
