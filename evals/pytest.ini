[pytest]
# Eval suite. Drives a LIVE `claude` CLI and spends real money ($16-33 for a full run).
# Deliberately unreachable from the repo-root pytest.ini: `testpaths` there stays `tests`.
# DO NOT add `evals` to the root pytest.ini — that converts this design to a run-by-default suite.
# Invoke explicitly:
#   pytest -c evals/pytest.ini evals                                     # $0 (see note below)
#   pytest -c evals/pytest.ini evals -m "smoke"                          # 4 rows,  ~$1,  ~1 min
#   pytest -c evals/pytest.ini evals -m "smoke or full"                  # 53 rows, ~$16-27, ~28-54 min
#   pytest -c evals/pytest.ini evals -m "smoke or full or prerelease"    # 54 rows, ~$19-33, ~32-65 min
# The bare (no `-m`) form is $0 ONLY because of two things holding together, not
# because it collects nothing live: `python_files` below matches BOTH selftest/
# and cases/ files, so a marker-less run DOES collect the live-cost case rows --
# each one self-skips from inside its module-scoped `scratch` FIXTURE (not its
# test body -- fixtures resolve first, so a body-level skip is too late and
# still pays for the scratch root, the plugin copy, and any live template
# build) when no explicit `-m` marker was passed. See evals/cases/*.py.
# If a future case row puts that guard anywhere but the fixture, or a selftest
# drives a live marker expression as a nested subprocess without `--collect-only`
# (see evals/selftest/test_tier_gate.py), the bare form silently stops being $0.
testpaths = .
# Backstop: the explicit `evals` path argument above is what scopes collection.
# This key exists so an invocation that omits that argument cannot silently
# sweep the repo's own test suite into an eval run.
norecursedirs = tests
pythonpath = ../plugins/planwise/scripts .
python_files = eval_*.py test_*.py
markers =
    smoke: harness canary — empty-fixture rows only, no fixture template needed
    full: the full case matrix minus the unmeasured T6 row
    prerelease: rows that run only before a version tag
addopts = -ra --strict-markers
