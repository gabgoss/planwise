name: Release

# A release is a merged PR that changes the plugin version (tools/bump_version.py).
# This workflow tags that merge commit planwise--vX.Y.Z and publishes a GitHub
# Release. The notes come from release-notes/X.Y.Z.md when the release PR adds
# that file. Without it, GitHub builds them from the squashed PR titles since
# the last release.

on:
  push:
    branches: [main]
    paths:
      - plugins/planwise/.claude-plugin/plugin.json
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Read and check the version
        id: version
        run: |
          read_version() { python -c "import json,sys; print(json.load(open(sys.argv[1], encoding='utf-8'))['version'])" "$1"; }
          plugin=$(read_version plugins/planwise/.claude-plugin/plugin.json)
          market=$(read_version .claude-plugin/marketplace.json)
          if [ "$plugin" != "$market" ]; then
            echo "::error::plugin.json says $plugin but marketplace.json says $market. Run tools/bump_version.py."
            exit 1
          fi
          if ! echo "$plugin" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'; then
            echo "::notice::$plugin is not semver, so no release is cut."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tag="planwise--v$plugin"
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "::notice::$tag already exists, so no release is cut."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          prerelease=false
          case "$plugin" in *-*) prerelease=true ;; esac
          {
            echo "skip=false"
            echo "version=$plugin"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - name: Tag and publish the GitHub Release
        if: steps.version.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags=()
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          # The release PR may carry hand-written notes. They were reviewed with the bump.
          notes="release-notes/$VERSION.md"
          if [ -s "$notes" ]; then
            echo "::notice::publishing the notes in $notes"
            flags+=(--notes-file "$notes")
          else
            echo "::notice::no $notes, so GitHub builds the notes from the merged PR titles"
            flags+=(--generate-notes)
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "Planwise $VERSION" "${flags[@]}"
